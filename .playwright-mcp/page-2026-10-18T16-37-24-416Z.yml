    - generic [ref=e31]:
      - heading "Welkom op Koningsdag" [level=1] [ref=e32]
      - heading "De Oranjekermis is weer terug! Van 23 t/m 27 april!" [level=5] [ref=e33]
      - paragraph [ref=e34]: Het Oude Raadhuisplein is het centrum van de Koningsdagviering in Huizen. Om 10:00 uur begint de Koningsmarkt. Vanaf 10:15 uur zingt het Huizer shantykoor ‘De Zoute Zee’, en even voor elfen komen de gedecoreerden aan van de Brassershoeve naar het Oud Raadhuisplein. Dat zijn inwoners van Huizen die Koninklijk onderscheiden zijn vanwege hun bijzondere verdiensten voor onze samenleving. Ze worden begeleid door Drum- & Showband MCC. Na verwelkoming door de Oranje Stichting Huizen, wordt koningsdag 2024 officieel geopend door Burgemeester Niek Meijer. Ook huldigt hij de mensen die daags daarvóór een Koninklijke Onderscheiding hebben ontvangen.
      - paragraph [ref=e35]: Dan kan het feest losbarsten! Optredens van artiesten, dansgroepen en gezellige terrasjes maken het feest compleet.
      - paragraph [ref=e36]: Het stopt om 18:00 uur, maar dan begint om 19:00 het feest op Plein 2000. Om 20:00 uur is de Taptoe.
    - generic [ref=e38]:
      - generic [ref=e40]:
        - heading "Plein 2000" [level=2] [ref=e41]
        - text: Op Plein 2000 is een middag- en avondprogramma. Het middagprogramma zit vol met muziek, dans en sport gericht op kids en jongeren. Het avondprogramma biedt een wisselend aanbod aan muziekgenres. Het is een programma voor jong en oud! Vanaf 19:00 uur
      - generic [ref=e43]:
        - heading "Taptoe" [level=2] [ref=e44]
        - text: Op het veld van SV Huizen is er een taptoe, die loopt van 20:00 tot 22:00 uur. Het is een prachtig muziekspektakel met optredens van drie korpsen uit verschillende delen van het land. Zo’n 800 personen kunnen plaatsnemen op de overdekte tribune. Er zijn ook voldoende staanplaatsen. De toegang is gratis.
      - generic [ref=e46]:
        - heading "Kindervrijmarkt" [level=2] [ref=e47]
        - text: De kindervrijmarkt wordt gehouden van 10:00 tot 17:00 uur. De Kindervrijmarkt is gratis en voor kinderen tot circa 12 jaar die met een kleedje op de grond hun spulletjes aan de man proberen te brengen. Begeleiders zijn welkom. De kinderen kunnen ’s morgens vanaf 07:00 uur zelf een leuk plekje uitzoeken, maar vol is vol.
    - generic [ref=e49]:
      - paragraph [ref=e50]: Koningsdag in Huizen is mogelijk dankzij de inzet van vele vrijwilligers. De coördinatie is in handen van de Oranje Stichting Huizen.
      - paragraph [ref=e51]: De gemeente geeft weliswaar subsidie, maar het feest is niet mogelijk zonder de bijdrage van sponsoren. Zeer veel dank daarvoor. De namen van de sponsoren vindt je bij de verschillende onderdelen op deze website. Ook op je mobiel is de website prima te bekijken! We krijgen geweldige steun van de gemeente als het gaat om dranghekken, wegafsluitingen, schoonmaken, adviezen, etc. Ook zeer dank daarvoor!
